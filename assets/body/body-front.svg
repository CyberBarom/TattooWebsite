<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 500 900"
    role="img"
    aria-labelledby="bodyTitle bodyDescription"
>

    <title id="bodyTitle">
        Cuerpo humano — vista frontal
    </title>

    <desc id="bodyDescription">
        Selector interactivo de zonas del cuerpo para visualizar un tatuaje.
    </desc>


    <!-- ==================================================
         DEFINITIONS
    ================================================== -->

    <defs>

        <linearGradient
            id="bodyGradientFront"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#e9e1d5"
                stop-opacity="0.10"
            />

            <stop
                offset="50%"
                stop-color="#c9bfb1"
                stop-opacity="0.055"
            />

            <stop
                offset="100%"
                stop-color="#81786d"
                stop-opacity="0.025"
            />

        </linearGradient>


        <linearGradient
            id="selectedGradientFront"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#ead39b"
                stop-opacity="0.34"
            />

            <stop
                offset="100%"
                stop-color="#d6b36a"
                stop-opacity="0.16"
            />

        </linearGradient>


        <filter
            id="zoneGlowFront"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
        >

            <feGaussianBlur
                stdDeviation="4"
                result="blur"
            />

            <feMerge>

                <feMergeNode
                    in="blur"
                />

                <feMergeNode
                    in="SourceGraphic"
                />

            </feMerge>

        </filter>


        <filter
            id="softShadowFront"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%"
        >

            <feDropShadow
                dx="0"
                dy="3"
                stdDeviation="5"
                flood-color="#000000"
                flood-opacity="0.22"
            />

        </filter>

    </defs>


    <!-- ==================================================
         HEAD
    ================================================== -->

    <ellipse
        cx="250"
        cy="80"
        rx="42"
        ry="52"
        fill="url(#bodyGradientFront)"
        stroke="#77716a"
        stroke-width="2"
        opacity="0.95"
    />


    <!-- ==================================================
         NECK
    ================================================== -->

    <path
        d="
            M225 120
            L225 155
            L275 155
            L275 120
        "
        fill="url(#bodyGradientFront)"
        stroke="#77716a"
        stroke-width="2"
    />


    <!-- ==================================================
         CHEST
    ================================================== -->

    <g
        id="chest"
        class="tattoo-zone"
        data-zone="Pecho"
        tabindex="0"
        role="button"
        aria-label="Seleccionar pecho"
    >

        <path
            d="
                M225 145

                C195 145
                165 160
                145 190

                L165 310

                C190 330
                220 335
                250 335

                C280 335
                310 330
                335 310

                L355 190

                C335 160
                305 145
                275 145

                Z
            "
            fill="url(#bodyGradientFront)"
            stroke="#77716a"
            stroke-width="2.5"
        />

    </g>


    <!-- ==================================================
         UPPER ARM LEFT
    ================================================== -->

    <g
        id="upper-arm-left"
        class="tattoo-zone"
        data-zone="Parte superior brazo izquierdo"
        tabindex="0"
        role="button"
        aria-label="Seleccionar parte superior del brazo izquierdo"
    >

        <path
            d="
                M165 170

                C145 178
                128 195
                118 220

                L102 270

                L145 292

                L175 212

                C181 193
                177 179
                165 170

                Z
            "
            fill="url(#bodyGradientFront)"
            stroke="#77716a"
            stroke-width="2.5"
        />

    </g>


    <!-- ==================================================
         FOREARM LEFT
    ================================================== -->

    <g
        id="forearm-left"
        class="tattoo-zone"
        data-zone="Antebrazo izquierdo"
        tabindex="0"
        role="button"
        aria-label="Seleccionar antebrazo izquierdo"
    >

        <path
            d="
                M105 270

                L75 350

                C70 370
                75 390
                90 400

                C105 410
                122 402
                130 385

                L160 300

                Z
            "
            fill="url(#bodyGradientFront)"
            stroke="#77716a"
            stroke-width="2.5"
        />

    </g>


    <!-- ==================================================
         UPPER ARM RIGHT
    ================================================== -->

    <g
        id="upper-arm-right"
        class="tattoo-zone"
        data-zone="Parte superior brazo derecho"
        tabindex="0"
        role="button"
        aria-label="Seleccionar parte superior del brazo derecho"
    >

        <path
            d="
                M335 170

                C355 178
                372 195
                382 220

                L398 270

                L355 292

                L325 212

                C319 193
                323 179
                335 170

                Z
            "
            fill="url(#bodyGradientFront)"
            stroke="#77716a"
            stroke-width="2.5"
        />

    </g>


    <!-- ==================================================
         FOREARM RIGHT
    ================================================== -->

    <g
        id="forearm-right"
        class="tattoo-zone"
        data-zone="Antebrazo derecho"
        tabindex="0"
        role="button"
        aria-label="Seleccionar antebrazo derecho"
    >

        <path
            d="
                M395 270

                L425 350

                C430 370
                425 390
                410 400

                C395 410
                378 402
                370 385

                L340 300

                Z
            "
            fill="url(#bodyGradientFront)"
            stroke="#77716a"
            stroke-width="2.5"
        />

    </g>


    <!-- ==================================================
         THIGH LEFT
    ================================================== -->

    <g
        id="thigh-left"
        class="tattoo-zone"
        data-zone="Muslo izquierdo"
        tabindex="0"
        role="button"
        aria-label="Seleccionar muslo izquierdo"
    >

        <path
            d="
                M175 310

                C170 355
                168 405
                166 455

                L165 525

                L245 525

                L250 335

                C225 335
                198 330
                175 310

                Z
            "
            fill="url(#bodyGradientFront)"
            stroke="#77716a"
            stroke-width="2.5"
        />

    </g>


    <!-- ==================================================
         THIGH RIGHT
    ================================================== -->

    <g
        id="thigh-right"
        class="tattoo-zone"
        data-zone="Muslo derecho"
        tabindex="0"
        role="button"
        aria-label="Seleccionar muslo derecho"
    >

        <path
            d="
                M250 335

                L255 525

                L335 525

                C332 455
                330 405
                325 310

                C302 330
                275 335
                250 335

                Z
            "
            fill="url(#bodyGradientFront)"
            stroke="#77716a"
            stroke-width="2.5"
        />

    </g>


    <!-- ==================================================
         CALF LEFT
    ================================================== -->

    <g
        id="calf-left"
        class="tattoo-zone"
        data-zone="Pantorrilla izquierda"
        tabindex="0"
        role="button"
        aria-label="Seleccionar pantorrilla izquierda"
    >

        <path
            d="
                M165 525

                L160 755

                C160 785
                175 800
                195 800

                C215 800
                225 785
                225 760

                L245 525

                Z
            "
            fill="url(#bodyGradientFront)"
            stroke="#77716a"
            stroke-width="2.5"
        />

    </g>


    <!-- ==================================================
         CALF RIGHT
    ================================================== -->

    <g
        id="calf-right"
        class="tattoo-zone"
        data-zone="Pantorrilla derecha"
        tabindex="0"
        role="button"
        aria-label="Seleccionar pantorrilla derecha"
    >

        <path
            d="
                M255 525

                L275 760

                C275 785
                285 800
                305 800

                C325 800
                340 785
                340 755

                L335 525

                Z
            "
            fill="url(#bodyGradientFront)"
            stroke="#77716a"
            stroke-width="2.5"
        />

    </g>


    <!-- ==================================================
         CENTER LINE
    ================================================== -->

    <path
        d="
            M250 155
            L250 525
        "
        fill="none"
        stroke="#55504a"
        stroke-width="1"
        opacity="0.35"
        pointer-events="none"
    />


    <!-- ==================================================
         INTERACTION
    ================================================== -->

    <style>

        .tattoo-zone {

            cursor: pointer;

            transition:
                fill 0.25s ease,
                stroke 0.25s ease,
                stroke-width 0.25s ease,
                filter 0.25s ease,
                opacity 0.25s ease;

            transform-box: fill-box;
            transform-origin: center;

        }


        .tattoo-zone:hover {

            fill:
                rgba(214,179,106,0.22);

            stroke:
                #d6b36a;

            stroke-width:
                3.5;

            filter:
                drop-shadow(
                    0 0 7px
                    rgba(214,179,106,0.35)
                );

        }


        .tattoo-zone.selected {

            fill:
                url(#selectedGradientFront);

            stroke:
                #ead39b;

            stroke-width:
                4;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(214,179,106,0.48)
                );

        }


        .tattoo-zone:focus {

            outline:
                none;

        }


        .tattoo-zone:focus-visible {

            stroke:
                #ead39b;

            stroke-width:
                4;

        }

    </style>

</svg>
